<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C0D0A">
<title>You are offline · Aries 11 Bakehouse</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #1C0D0A; color: #FFFDF8; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 18px; padding: max(32px, env(safe-area-inset-top)) 28px max(32px, env(safe-area-inset-bottom)); text-align: center; }
  img { width: min(260px, 60vw); height: auto; }
  h1 { margin: 6px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: clamp(34px, 8vw, 52px); line-height: 1.05; }
  h1 em { color: #D8B98C; }
  p { margin: 0; max-width: 34ch; color: rgba(255,253,248,.72); font-size: 16px; line-height: 1.55; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
  a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; border-radius: 999px; font: 800 14px/1 inherit; text-decoration: none; cursor: pointer; }
  button { border: 0; background: #F5EBD6; color: #2B140F; }
  a { border: 1.5px solid rgba(255,253,248,.28); color: #FFFDF8; background: transparent; }
  :focus-visible { outline: 2px solid #F5EBD6; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/uploads/Aries11_Primary_Dark.svg" alt="Aries 11 Bakehouse" width="681" height="344">
  <h1>You&rsquo;re offline, <em>for now.</em></h1>
  <p>Pages you&rsquo;ve already opened still work. Ordering and payment need a connection.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/menu">Saved menu</a>
  </div>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>

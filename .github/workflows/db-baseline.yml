name: Database baseline

# ONE-TIME bootstrap. Production was set up by hand-running schema.sql and the
# patch files, so its migration history is empty. This workflow
#   1. diffs the live schema against supabase/migrations (read-only), and
#   2. optionally records the baseline migrations as already applied
#      (history table only; no schema or data is changed).
# Run it once with record = false, read the diff, then run again with record = true.

on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record the baseline as applied (writes to the migration history table only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-baseline
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.117.0
  # Everything up to and including the last hand-applied patch.
  BASELINE_MAX_VERSION: '20260729001300'

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD secrets and the SUPABASE_PROJECT_ID variable first (docs/CICD.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remote migration history (before)
        run: supabase migration list

      - name: Diff live schema vs migrations (read-only)
        run: |
          supabase db diff --linked --schema public | tee diff.sql
          {
            echo "### Live schema vs migrations (public schema)"
            if [ -s diff.sql ]; then
              echo "Differences found. Review before recording the baseline:"
              echo '```sql'; head -c 60000 diff.sql; echo '```'
            else
              echo "No differences. The migrations describe production exactly."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record baseline as applied
        if: inputs.record
        run: |
          versions=$(ls supabase/migrations | cut -d_ -f1 | awk -v max="$BASELINE_MAX_VERSION" '$1 <= max')
          echo "Marking as applied: $versions"
          supabase migration repair --status applied $versions
          supabase migration list

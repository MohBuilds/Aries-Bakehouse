name: CI/CD

# Pull requests / staging: lint + build + migration check + Vercel preview.
# Push to main:  lint + build + migration check -> migrate DB -> deploy edge
# functions -> deploy to Vercel production. Setup steps: docs/CICD.md

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One run per branch at a time; a newer push to main queues behind the running
# one instead of cancelling it, so a migration is never interrupted halfway.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: 2.117.0
  VERCEL_CLI_VERSION: 58.4.4

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      db_any: ${{ steps.filter.outputs.db_any }}
      db_new: ${{ steps.filter.outputs.db_new }}
      functions_new: ${{ steps.filter.outputs.functions_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db_any:
              - 'supabase/migrations/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            db_new:
              - added|modified: 'supabase/migrations/**'
            functions_new:
              - added|modified: 'supabase/functions/**'
              - added|modified: 'supabase/config.toml'

  quality:
    name: Lint & build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # Replays every migration on a brand-new Postgres (+ Supabase auth), then the
  # seed. Catches a broken or out-of-order migration before it reaches prod.
  db-check:
    name: Migrations apply cleanly
    needs: changes
    if: needs.changes.outputs.db_any == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase (applies migrations, then seed.sql)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Show applied migrations
        run: supabase migration list --local
      - if: failure()
        run: docker ps -a && docker logs supabase_db_aries-bakehouse --tail 80 || true

  migrate:
    name: Migrate production database
    needs: [changes, quality, db-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.db_new == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::New migrations were pushed but these are not configured:$missing. See docs/CICD.md."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview pending migrations
        id: dry
        run: |
          supabase db push --dry-run 2>&1 | tee dry-run.txt
          # If the baseline is still "pending", production's history was never
          # bootstrapped; pushing would re-run the whole schema on live data.
          if grep -q "20260728000000_baseline_schema" dry-run.txt; then
            echo "::error::Production migration history is empty. Run the 'Database baseline' workflow first (docs/CICD.md)."
            exit 1
          fi
      - name: Apply migrations
        run: supabase db push --yes

  functions:
    name: Deploy edge functions
    needs: [changes, quality, migrate]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.functions_new == 'true' &&
      needs.quality.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.migrate.result)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Edge functions changed but SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID are not configured. See docs/CICD.md."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # verify_jwt per function comes from supabase/config.toml.
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

  deploy-production:
    name: Deploy to Vercel (production)
    needs: [quality, migrate, functions]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.migrate.result) &&
      contains(fromJSON('["success","skipped"]'), needs.functions.result)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel deploy is not configured (VERCEL_TOKEN secret, VERCEL_ORG_ID / VERCEL_PROJECT_ID variables). See docs/CICD.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel builds with its own stored environment variables.
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Vercel preview
    needs: quality
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel preview skipped: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not configured (docs/CICD.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none             --body "Preview deployment: ${{ steps.deploy.outputs.url }}"
